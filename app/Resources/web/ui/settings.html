<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="settings.css">
<script src="/runtime/runtime.js"></script>
</head>
<body>
  <header class="topbar" id="topbar">
    <span class="title">Customize</span>
    <span class="spacer"></span>
    <button class="btn ghost" id="openBuilderTop">Template Builder</button>
    <button class="btn primary" id="activate">Use as Wallpaper</button>
  </header>

  <div class="workspace">
    <aside class="panel left">
      <div class="panel-head">Templates<span class="spacer"></span><button class="icon-btn" id="newTemplate" title="New template in the Builder"></button></div>
      <div class="scroll" id="templates"></div>
      <div class="left-foot">
        <button class="btn ghost wide" id="openFolder">Open templates folder</button>
        <button class="btn ghost wide" id="reload">Reload templates</button>
      </div>
    </aside>

    <main class="stage">
      <div class="stage-head">
        <div class="titles">
          <h1 id="tplName"></h1>
          <p id="tplDesc"></p>
        </div>
        <span class="badge" id="activeBadge" hidden>Current wallpaper</span>
      </div>
      <div class="preview-wrap" id="previewWrap">
        <div class="preview-frame" id="previewFrame"><iframe id="preview" title="Preview"></iframe></div>
      </div>
      <div class="stage-foot" id="nowPlaying"></div>
    </main>

    <aside class="panel right">
      <div class="panel-head">Settings</div>
      <div class="scroll" id="params"></div>
      <div class="right-foot">
        <button class="btn wide" id="editCode">Duplicate &amp; edit code</button>
        <button class="btn ghost wide" id="reset">Reset to defaults</button>
      </div>
    </aside>
  </div>

  <script src="settings.js"></script>
</body>
</html>
