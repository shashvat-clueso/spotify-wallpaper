<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/runtime/runtime.css">
<script src="/runtime/runtime.js"></script>
<style>
  body { background: #000; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
  .bg { position: absolute; inset: -12%; background: center / cover no-repeat; }
  .bg-gradient { position: absolute; inset: 0; background: linear-gradient(160deg, var(--vibrant), var(--deep) 55%, var(--dark)); }
  .shade { position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.45)); }
  .stack { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 11vh; text-align: center; }
  .date { font-size: 2.6vmin; font-weight: 600; opacity: .85; }
  .clock { font-family: var(--param-clockFont); font-weight: var(--param-clockWeight); font-stretch: var(--param-clockWidth);
    font-size: var(--param-clockSize); line-height: 1; letter-spacing: -0.02em; margin-top: .5vmin; font-variant-numeric: tabular-nums;
    text-shadow: 0 1vmin 5vmin rgba(0,0,0,.25); }
  .lyric { margin-top: 5vmin; font-size: 3.6vmin; font-weight: 700; max-width: 70vw; line-height: 1.25; text-shadow: 0 .4vmin 2vmin rgba(0,0,0,.3); }
  .pill { position: absolute; left: 50%; bottom: 7vh; transform: translateX(-50%); width: min(62vmin, 80vw); display: flex; align-items: center; gap: 2vmin;
    padding: 1.6vmin; border-radius: 3vmin; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.18);
    -webkit-backdrop-filter: blur(30px) saturate(1.5); backdrop-filter: blur(30px) saturate(1.5); }
  .pill img { width: 7vmin; height: 7vmin; border-radius: 1.2vmin; object-fit: cover; }
  .pill .meta { flex: 1; min-width: 0; text-align: left; }
  .pill .t { font-weight: 700; font-size: 2vmin; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill .a { font-size: 1.7vmin; opacity: .7; margin-top: .3vmin; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill progress-bar { margin-top: 1.1vmin; height: .45vmin; color: #fff; background: rgba(255,255,255,.3); }
  .eq { display: flex; gap: .45vmin; align-items: flex-end; height: 3vmin; margin-right: .6vmin; }
  .eq i { width: .55vmin; height: 100%; background: #fff; border-radius: 1vmin; transform-origin: bottom; transform: scaleY(.3); }
  .sw-live.is-playing .eq i { animation: eq .9s ease-in-out infinite alternate; }
  .eq i:nth-child(2) { animation-delay: -.3s !important; animation-duration: .7s !important; }
  .eq i:nth-child(3) { animation-delay: -.6s !important; animation-duration: 1.1s !important; }
  @keyframes eq { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
</style>
</head>
<body>
  <div class="bg" data-show="params.background|isBlur" data-cover-blur="140" data-cover-saturate="1.4"></div>
  <div class="bg-gradient" data-show="!params.background|isBlur"></div>
  <div class="shade"></div>
  <div class="sw-grain" data-show="params.grain"></div>
  <div class="stack">
    <div class="date" data-bind="time.date"></div>
    <div class="clock" id="clock"></div>
    <div class="lyric" data-lyrics data-animate data-show="params.showLyric" data-bind="lyrics.current|note"></div>
  </div>
  <div class="pill">
    <img data-src="track.cover" alt="">
    <div class="meta"><div class="t" data-bind="track.title"></div><div class="a" data-bind="track.artist"></div><progress-bar></progress-bar></div>
    <div class="eq"><i></i><i></i><i></i></div>
  </div>
  <script>
    const clock = document.getElementById("clock");
    const show = (ctx) => {
      const text = ctx.params.clock === "24" ? ctx.time.clock24 : ctx.time.clock.replace(/\s?[AP]M$/i, "");
      if (clock.textContent !== text) clock.textContent = text;
    };
    Wallpaper.on("render", show);
    Wallpaper.on("tick", show);  // once a second is plenty for a clock
  </script>
</body>
</html>
