<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/runtime/runtime.css">
<script src="/runtime/runtime.js"></script>
<style>
  /* The slip hangs from the top edge and grows as the song prints. --r is the receipt's type size. */
  :root { --r: max(12px, 1.02vw); --w: max(330px, 29vw); --lift: 0px; }
  body { background: #1b1424; color: #fff; }
  .bg { position: absolute; inset: -12%; background: center / cover no-repeat; }
  .shade { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 90% at 30% 70%, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.45)), #000; opacity: var(--param-dim); }
  .shade2 { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0, 0, 0, 0.35), transparent 55%); }
  .param-side-left .shade2 { background: linear-gradient(270deg, rgba(0, 0, 0, 0.35), transparent 55%); }
  .sw-grain { opacity: 0.07; }

  /* ---------- the slip ---------- */
  .hang { position: absolute; top: 0; right: 9vw; width: var(--w); transform: translateY(var(--lift)) rotate(var(--param-tilt)); transform-origin: 50% 0;
    filter: drop-shadow(0 1.6vmin 2.4vmin rgba(0, 0, 0, 0.42)) drop-shadow(0 0.2vmin 0.3vmin rgba(0, 0, 0, 0.25)); }
  .sw-live .hang { transition: transform 0.9s cubic-bezier(0.3, 0.7, 0.2, 1); }
  .side-left .hang { right: auto; left: 9vw; }
  .paper { position: relative; overflow: hidden; background: var(--param-paper); color: var(--param-ink);
    padding: calc(var(--r) * 4.6) calc(var(--r) * 2) calc(var(--r) * 3.2);
    font: 500 var(--r) / 1.5 ui-monospace, "SF Mono", Menlo, monospace; text-transform: uppercase; letter-spacing: 0.02em;
    -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - var(--r) * 0.9) no-repeat, conic-gradient(from 135deg at top, #000 90deg, transparent 0) bottom / calc(var(--r) * 1.5) calc(var(--r) * 0.9) repeat-x;
    mask: linear-gradient(#000 0 0) top / 100% calc(100% - var(--r) * 0.9) no-repeat, conic-gradient(from 135deg at top, #000 90deg, transparent 0) bottom / calc(var(--r) * 1.5) calc(var(--r) * 0.9) repeat-x; }
  /* thermal paper: a slight curl of light across it, and print that's never quite black */
  .paper::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(0, 0, 0, 0.05), transparent 12%, transparent 85%, rgba(0, 0, 0, 0.06)), url("/runtime/grain.png") 0 0 / 256px 256px; opacity: 0.16; mix-blend-mode: multiply; }
  .c { text-align: center; }
  .store { font-size: calc(var(--r) * 1.9); line-height: 1.12; letter-spacing: 0.04em; font-weight: 700; margin-bottom: calc(var(--r) * 0.5); text-wrap: balance; }
  .dim { opacity: 0.6; }
  hr { border: 0; border-top: max(1px, calc(var(--r) * 0.11)) dashed currentColor; opacity: 0.45; margin: calc(var(--r) * 1.05) 0; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: calc(var(--r) * 1.4); padding: calc(var(--r) * 0.12) calc(var(--r) * 0.45); margin: 0 calc(var(--r) * -0.45); }
  .row > span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row.hd { opacity: 0.55; font-size: calc(var(--r) * 0.85); letter-spacing: 0.12em; }
  .it > span:first-child { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .it.past { opacity: 0.55; }
  .it.cur { background: var(--param-ink); color: var(--param-paper); opacity: 1; }
  .it.gap > span:first-child { font-style: italic; opacity: 0.8; }
  .sw-live .it.new { animation: print 0.55s steps(6, end); }
  @keyframes print { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
  .big { font-size: calc(var(--r) * 1.35); font-weight: 700; }
  .barcode { height: calc(var(--r) * 4.4); margin: calc(var(--r) * 1.4) calc(var(--r) * 0.6) calc(var(--r) * 0.4); display: flex; align-items: stretch; }
  .barcode i { background: currentColor; }
  .num { text-align: center; letter-spacing: 0.4em; font-size: calc(var(--r) * 0.85); }
  .printing { text-align: center; letter-spacing: 0.3em; opacity: 0.6; }
  .sw-live.is-playing .printing { animation: dots 1.2s steps(2, jump-none) infinite; }
  @keyframes dots { 50% { opacity: 0.25; } }

  /* ---------- the song, on the other side ---------- */
  .side { position: absolute; left: 6vw; bottom: 8vh; max-width: calc(100vw - var(--w) - 24vw); text-shadow: 0 0.2vmin 2vmin rgba(0, 0, 0, 0.3); }
  .side-left .side { left: auto; right: 6vw; text-align: right; }
  .side .k { font: 600 max(11px, 1vw) / 1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.24em; text-transform: uppercase; opacity: 0.75; margin-bottom: 2vh; }
  .side .t { font-family: var(--param-titleFont); font-weight: 700; font-size: 5.2vw; line-height: 0.95; letter-spacing: -0.035em; text-wrap: balance;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .side .a { font: 500 max(12px, 1.25vw) / 1.4 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.8; margin-top: 2.2vh; }

  @media (max-aspect-ratio: 1/1) {
    :root { --r: max(12px, 2.1vw); --w: 64vw; }
    .hang, .side-left .hang { left: auto; right: 7vw; }
    .side, .side-left .side { left: 7vw; right: 7vw; text-align: left; max-width: none; bottom: 5vh; }
    .side .t { font-size: 8vw; }
  }
</style>
</head>
<body>
  <div class="bg" data-cover-blur="params.blur" data-cover-saturate="1.3"></div>
  <div class="shade"></div>
  <div class="shade2"></div>
  <div class="side">
    <div class="k" id="k"></div>
    <div class="t" data-bind="track.title"></div>
    <div class="a"><span data-bind="track.artist"></span></div>
  </div>
  <div class="hang" id="hang"><div class="paper" id="paper"></div></div>
  <div class="sw-grain" data-show="params.grain"></div>

  <script>
    const $ = (id) => document.getElementById(id), root = document.documentElement;
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
    const hash = (str) => { let h = 2166136261; for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619); return h >>> 0; };

    // A barcode for the song: Code 128-looking bars from the track's id (bars and gaps of 1–4 modules).
    function barcode(id) {
      let h = hash(String(id || "song")), html = "";
      const rnd = () => ((h = (Math.imul(h, 1664525) + 1013904223) >>> 0) % 4) + 1;
      let total = 0;
      const bars = [];
      for (let k = 0; k < 46; k++) { const w = k < 2 || k > 43 ? 1 : rnd(); bars.push(w); total += w; }
      bars.forEach((w, k) => { html += `<i style="flex:${w} 0 0;${k % 2 ? "background:transparent" : ""}"></i>`; });
      return `<div class="barcode">${html}</div><div class="num">${String(hash(String(id)) % 1e12).padStart(12, "0").replace(/(\d{4})(?=\d)/g, "$1 ")}</div>`;
    }

    let printed = -2, printedFor = null;
    function build(ctx) {
      const t = ctx.track, L = ctx.lyrics;
      const order = String(hash(String(t.id)) % 10000).padStart(4, "0");
      let items = "", count = 0;
      const sung = L.lines.filter((l) => l.text.trim()).length;
      if (L.hasLyrics) {
        for (let k = 0; k <= L.index && k < L.lines.length; k++) {
          const l = L.lines[k], gap = !l.text.trim();
          if (!gap) count++;
          const text = ctx.focus ? (gap ? "~ instrumental ~" : "Line " + String(count).padStart(2, "0")) : gap ? "~ instrumental ~" : l.text;
          const cls = "row it" + (k === L.index ? " cur" : " past") + (gap ? " gap" : "") + (k === L.index && printed !== L.index && printedFor === t.id ? " new" : "");
          items += `<div class="${cls}"><span>${esc(text)}</span><span>${fmt(l.t)}</span></div>`;
        }
        if (L.index < 0) items = `<div class="row it dim"><span>Intro</span><span>0:00</span></div>`;
      } else {
        items = `<div class="row it"><span>${esc(t.title || "")}</span><span>${t.length}</span></div>`;
        if (t.album) items += `<div class="row it past"><span>${esc(t.album)}</span><span>1 pc</span></div>`;
        if (t.genre) items += `<div class="row it past"><span>${esc(t.genre)}</span><span>—</span></div>`;
      }
      const done = !L.hasLyrics || (L.index >= L.lines.length - 1 && L.lines.length) || t.progress > 0.98;
      const html = `
        <div class="c store">${esc(t.artist || "Now playing")}</div>
        <div class="c">${esc(t.album || "")}</div>
        <div class="c dim">${esc(t.genre ? t.genre + " · " : "")}Side ${t.progress < 0.5 ? "A" : "B"}</div>
        <hr>
        <div class="row"><span>Order ${order}</span><span>${esc(ctx.time.clock24)}</span></div>
        <div class="row dim"><span>${esc(ctx.time.date)}</span><span></span></div>
        <hr>
        <div class="row hd"><span>Item</span><span>At</span></div>
        ${items}
        <hr>
        <div class="row"><span>Lines</span><span>${L.hasLyrics ? count + " / " + sung : "—"}</span></div>
        <div class="row"><span>Elapsed</span><span id="el">${t.elapsed}</span></div>
        <div class="row big"><span>Total</span><span>${t.length}</span></div>
        ${done ? `<hr><div class="c">Thank you for listening</div>${barcode(t.id)}` : `<hr><div class="printing">· · · printing · · ·</div>`}`;
      printed = L.index; printedFor = t.id;
      return html;
    }

    let lastH = 0;
    function grow() {
      const paper = $("paper"), hang = $("hang"), H = innerHeight;
      const h = paper.offsetHeight;
      // the slip is pulled up so its end stays on screen
      const lift = Math.min(0, H * 0.9 - h);
      root.style.setProperty("--lift", lift + "px");
      if (Wallpaper.live && lastH && h !== lastH) paper.animate([{ height: lastH + "px" }, { height: h + "px" }], { duration: 550, easing: "cubic-bezier(.3,.7,.2,1)" });
      lastH = h;
    }

    Wallpaper.on("render", (ctx) => {
      root.classList.toggle("side-left", ctx.params.side === "left");
      const html = build(ctx);
      $("paper").innerHTML = html;
      const L = ctx.lyrics;
      $("k").textContent = L.hasLyrics && L.index >= 0 ? "Item " + String(L.index + 1).padStart(2, "0") + " · " + ctx.track.elapsed : "Now printing";
    });
    Wallpaper.on("layout", grow);
    Wallpaper.on("track", () => { lastH = 0; });
    Wallpaper.on("tick", (ctx) => {
      const el = $("el");
      if (el && el.textContent !== ctx.track.elapsed) el.textContent = ctx.track.elapsed;
    });
    addEventListener("resize", () => { lastH = 0; Wallpaper.refresh(); });
  </script>
</body>
</html>
