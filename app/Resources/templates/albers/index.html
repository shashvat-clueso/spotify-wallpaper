<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/runtime/runtime.css">
<script src="/runtime/runtime.js"></script>
<style>
  /* Homage to the Square: on a panel of 10 units, squares of 8, 6 and 4 units, each 1 unit in from the sides, with
     the bottom margin half the top one (0.5, 1, 1.5 units). --P is the panel; the outer colour fills the screen. */
  :root { --P: 94vh; --c0: #2b1f5c; --c1: #7a3fc8; --c2: #e0584a; --c3: #f2a15c; --ink: rgba(255, 255, 255, 0.86); --soft: rgba(255, 255, 255, 0.62); --t: 2.6s; }
  body { background: var(--c0); color: var(--ink); }
  .sw-live body, .sw-live .sq, .sw-live .txt { transition: background-color var(--t) cubic-bezier(0.45, 0, 0.25, 1), color var(--t) ease; }
  .panel { position: absolute; left: 50%; top: 50%; width: var(--P); height: var(--P); margin: calc(var(--P) / -2) 0 0 calc(var(--P) / -2); }
  .sq { position: absolute; }
  .s1 { left: 10%; right: 10%; top: 15%; bottom: 5%; background: var(--c1); }
  .s2 { left: 20%; right: 20%; top: 30%; bottom: 10%; background: var(--c2); }
  .s3 { left: 30%; right: 30%; top: 45%; bottom: 15%; background: var(--c3); }
  /* paint on masonite: the faintest uneven tooth */
  .sq::after, .ground { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 120% 90% at 30% 25%, rgba(255, 255, 255, 0.035), transparent 60%), radial-gradient(ellipse 100% 80% at 80% 90%, rgba(0, 0, 0, 0.05), transparent 60%); }
  .sw-grain { opacity: 0.09; }

  .mono { font: 500 max(10px, 1.15vmin) / 1.55 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.16em; text-transform: uppercase; }
  .txt { color: var(--soft); }
  .tag { position: absolute; top: 4.4vmin; max-width: calc((100vw - var(--P) * 0.8) / 2 - 8vmin); }
  .tag.l { left: 4.4vmin; }
  .tag.r { right: 4.4vmin; text-align: right; }
  .tag div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag b { font-weight: 500; color: var(--ink); }
  .cap { position: absolute; left: 4.4vmin; bottom: 4.4vmin; width: max(18vmin, calc((100vw - var(--P) * 0.8) / 2 - 10vmin)); color: var(--ink);
    font-family: var(--param-font); font-style: italic; font-size: 2.3vmin; line-height: 1.28; text-wrap: pretty; }
  .cap .tr { display: block; font-size: 0.8em; color: var(--soft); margin-top: 0.4em; }
  .foot { position: absolute; right: 4.4vmin; bottom: 4.4vmin; text-align: right; display: grid; gap: 1vmin; justify-items: end; }
  .chips { display: flex; gap: 0.6vmin; }
  .chips i { width: 1.5vmin; height: 1.5vmin; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12); }
  html:not(.param-caption) .cap { display: none; }

  /* portrait: the painting sits high, the caption below it */
  @media (max-aspect-ratio: 1/1) {
    .panel { top: 42%; }
    .tag { max-width: 44vw; }
    .cap { width: auto; right: 4.4vmin; bottom: 12vmin; font-size: 3.2vmin; }
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="sq s1"></div><div class="sq s2"></div><div class="sq s3"></div>
  </div>
  <div class="tag l mono txt"><div>Homage to</div><div><b data-bind="track.title"></b></div></div>
  <div class="tag r mono txt"><div><b data-bind="track.artist"></b></div><div data-bind="track.album"></div></div>
  <div class="cap txt" id="cap" data-lyrics></div>
  <div class="foot mono txt"><div class="chips" id="chips"></div><div id="when"></div></div>
  <div class="sw-grain" data-show="params.grain"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const rgb = (h) => { h = String(h || "#888").replace("#", ""); if (h.length === 3) h = h.replace(/./g, "$&$&"); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
    const lin = (v) => (v /= 255) <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    const lum = (h) => { const [r, g, b] = rgb(h); return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b); };
    const dist = (a, b) => { const x = rgb(a), y = rgb(b); return Math.abs(x[0] - y[0]) + Math.abs(x[1] - y[1]) + Math.abs(x[2] - y[2]); };
    const chroma = (h) => { const c = rgb(h); return Math.max(...c) - Math.min(...c); };
    const mix = (a, b, t) => { const x = rgb(a), y = rgb(b); return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join(""); };

    // The four strongest colours: the cover's main swatches in order of area, the most colourful ones first among
    // equals; a cover with fewer than four gets tones of its own colour, the way Albers often worked in one hue.
    function colours(ctx) {
      const C = ctx.colors || {}, pal = (C.palette || []).filter(Boolean);
      const out = [];
      const ranked = pal.map((c, k) => ({ c, score: (6 - k) * 18 + chroma(c) * 0.5 })).sort((a, b) => b.score - a.score).map((x) => x.c);
      for (const c of ranked) if (out.length < 4 && out.every((o) => dist(o, c) > 54)) out.push(c);
      const base = C.vibrant || out[0] || "#7a3fc8";
      const extra = [C.deep, C.light, C.card, C.dark, mix(base, "#000", 0.45), mix(base, "#fff", 0.55), mix(base, "#000", 0.7), mix(base, "#fff", 0.8)].filter(Boolean);
      for (const c of extra) if (out.length < 4 && out.every((o) => dist(o, c) > 54)) out.push(c);
      while (out.length < 4) out.push(mix(out[out.length - 1] || base, out.length % 2 ? "#fff" : "#000", 0.35));
      return out.sort((a, b) => lum(a) - lum(b));
    }

    // How the colours trade places, line by line: each keeps its neighbours readable.
    const PERMS = [[0, 1, 2, 3], [1, 0, 3, 2], [0, 2, 1, 3], [2, 3, 0, 1], [0, 3, 2, 1], [1, 2, 3, 0], [3, 1, 0, 2], [0, 1, 3, 2]];

    let painted = null;
    function paint(ctx) {
      const s = document.documentElement.style;
      let cols = colours(ctx);
      if (ctx.params.order === "light-out") cols = cols.reverse();
      const L = ctx.lyrics;
      const step = ctx.params.trade === false ? 0 : Math.max(0, L.hasLyrics ? L.index + 1 : Math.floor((ctx.track.position || 0) / 20));
      const key = ctx.track.id + "|" + step + "|" + ctx.params.order + "|" + ctx.params.trade;
      if (key === painted) return;
      painted = key;
      const perm = PERMS[step % PERMS.length];
      const c = perm.map((k) => cols[k]);
      c.forEach((v, k) => s.setProperty("--c" + k, v));
      // text on the outer colour
      const light = lum(c[0]) > 0.36;
      s.setProperty("--ink", light ? "rgba(20, 18, 16, 0.86)" : "rgba(255, 255, 255, 0.88)");
      s.setProperty("--soft", light ? "rgba(20, 18, 16, 0.55)" : "rgba(255, 255, 255, 0.6)");
      $("chips").innerHTML = cols.map((v) => `<i style="background:${v}"></i>`).join("");
    }

    Wallpaper.on("render", (ctx) => {
      const s = document.documentElement.style, W = innerWidth, H = innerHeight;
      const size = Math.max(0.5, Math.min(1, (+ctx.params.size || 94) / 100));
      s.setProperty("--P", Math.min(H, W) * size + "px");
      s.setProperty("--t", (parseFloat(ctx.params.speed) || 2.6) + "s");
      painted = null;
      paint(ctx);
      const L = ctx.lyrics;
      const text = L.index >= 0 && !L.isInstrumental ? L.current : "";
      const tr = ctx.params.translations !== false && L.translation ? `<span class="tr">${esc(L.translation)}</span>` : "";
      const html = text ? esc(text) + tr : "";
      if ($("cap").innerHTML !== html) $("cap").innerHTML = html;
      const w = (L.hasLyrics && L.index >= 0 ? "Line " + (L.index + 1) + " · " : "") + ctx.track.elapsed;
      if ($("when").textContent !== w) $("when").textContent = w;
    });
    Wallpaper.on("tick", (ctx) => {
      const L = ctx.lyrics, w = (L.hasLyrics && L.index >= 0 ? "Line " + (L.index + 1) + " · " : "") + ctx.track.elapsed;
      if ($("when").textContent !== w) $("when").textContent = w;
      if (!L.hasLyrics) paint(ctx);
    });
    addEventListener("resize", () => Wallpaper.refresh());
  </script>
</body>
</html>
