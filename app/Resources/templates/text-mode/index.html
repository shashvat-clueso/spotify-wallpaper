<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/runtime/runtime.css">
<script src="/runtime/runtime.js"></script>
<style>
  /* A text-mode screen: the cover as coloured characters on the right (on top in portrait), a shell on the left where
     the lyric is typed at the prompt and earlier lines scroll up as history, and a tmux-style status bar at the bottom.
     The art is drawn once per cover into two canvases: the normal one and a one-notch-brighter copy that flashes in on
     each beat (an opacity animation, so a beat repaints nothing). */
  :root { --m: 5vmin; --sb: 3.4vmin; --tx: 5vmin; --ty: 5vmin; --tw: 40vw; --tb: 8vmin;
    --mono: var(--param-font, ui-monospace), ui-monospace, "SF Mono", Menlo, monospace; }
  body { background: var(--param-screen); color: var(--param-text); font-family: var(--mono); }

  canvas.art { position: absolute; }
  #bright { opacity: 0; will-change: opacity; }

  /* ---------- the shell ---------- */
  .term { position: absolute; left: var(--tx); top: var(--ty); width: var(--tw); bottom: var(--tb);
    display: flex; flex-direction: column; font-size: var(--param-size); line-height: 1.42; }
  .dim { opacity: 0.46; }
  .ps { color: var(--param-prompt); }
  .cmd { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head .cmd { font-size: 0.72em; letter-spacing: 0.02em; }
  .title { display: block; width: 100%; margin: 0.5em 0 0.25em; font-weight: 700; line-height: 1.04; letter-spacing: -0.02em;
    color: var(--param-text); text-wrap: balance; }
  .meta { font-size: 0.8em; opacity: 0.72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta b { font-weight: 600; color: var(--param-prompt); opacity: 0.9; }
  .prog { font-size: 0.72em; margin-top: 0.9em; white-space: pre; opacity: 0.75; letter-spacing: 0; }
  .prog .on { color: var(--param-prompt); }
  .prog .off { opacity: 0.16; }

  .shell { position: relative; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
    -webkit-mask: linear-gradient(transparent, #000 32%); mask: linear-gradient(transparent, #000 32%); margin-top: 1.6em; }
  .hist { will-change: transform; }
  .hist > div { padding-left: 1.4em; text-indent: -1.4em; overflow-wrap: break-word; }
  .hist .p { font-size: 0.72em; padding-left: 0; text-indent: 0; margin-top: 0.9em; }
  .hist .past { opacity: 0.4; }
  .hist .past:nth-last-child(n + 4) { opacity: 0.3; }
  .hist .past:nth-last-child(n + 6) { opacity: 0.2; }
  .hist .note { display: inline-block; width: 1.4em; text-indent: 0; color: var(--param-prompt); }
  .hist .cur { color: var(--param-text); font-weight: 600; }
  .hist .cmt { opacity: 0.42; font-style: italic; }
  .caret { display: inline-block; width: 0.6em; height: 1.12em; margin-left: 0.08em; vertical-align: -0.2em; background: var(--param-text); }
  .sw-live.is-playing .caret { animation: blink 1.06s steps(1, end) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- tmux-style status bar ---------- */
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--sb); display: flex; align-items: center; gap: 1.2em;
    padding: 0 1.1em; font-size: calc(var(--sb) * 0.42); white-space: nowrap; background: var(--param-prompt); color: var(--param-screen); }
  .bar .s { font-weight: 700; }
  .bar .w { opacity: 0.75; }
  .bar .w.on { opacity: 1; font-weight: 700; }
  .bar .r { margin-left: auto; overflow: hidden; text-overflow: ellipsis; max-width: 55vw; }
  html:not(.param-statusBar) .bar { display: none; }

  /* the glass: faint scanlines and a vignette, static, drawn once */
  .crt { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 85% 85% at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.42)),
      repeating-linear-gradient(rgba(0, 0, 0, 0.16) 0 1px, transparent 1px 3px); }
</style>
</head>
<body>
  <canvas class="art" id="base"></canvas>
  <canvas class="art" id="bright"></canvas>

  <div class="term">
    <div class="head">
      <div class="cmd"><span class="ps">~/music</span> <span class="dim">$</span> now-playing</div>
      <fit-text class="title" id="title" max-lines="3" min="2.6vmin" max="7vmin" data-bind="track.title"></fit-text>
      <div class="meta" id="meta"></div>
      <div class="prog" id="prog"></div>
    </div>
    <div class="shell"><div class="hist" id="hist"></div></div>
  </div>

  <div class="crt"></div>
  <div class="bar">
    <span class="s">[music]</span>
    <span class="w">0:zsh-</span>
    <span class="w on">1:lyrics*</span>
    <span class="r" id="status"></span>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const rs = document.documentElement.style;
    const RAMPS = {
      classic: " .:-=+*#%@",
      detailed: " .'`^\",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$",
      blocks: " ·░▒▓█",
    };
    let img = null, imgKey = null, drawnKey = null, lastCtx = null;

    // ---------- geometry ----------
    function geometry(ctx) {
      const W = innerWidth, H = innerHeight, vmin = Math.min(W, H) / 100, m = 5 * vmin;
      const sb = ctx.params.statusBar === false ? 0 : 3.4 * vmin;
      const portrait = W / H < 1.05;
      let A, ax, ay, t;
      if (portrait) {
        A = Math.min(W - m * 2, (H - sb) * 0.52);
        ax = (W - A) / 2; ay = m;
        t = { x: m, y: ay + A + m * 0.9, w: W - m * 2, b: sb + m * 0.9 };
      } else {
        A = Math.min(H - sb - m * 1.6, W * 0.54);
        ax = W - A - m; ay = (H - sb - A) / 2;
        const w = Math.min(ax - m * 2.2, 60 * vmin * (W / H > 2 ? 1.3 : 1));
        t = { x: m * 1.3, y: m * 1.2, w, b: sb + m * 1.1 };
        // very wide screens: the picture sits in the middle of the space the shell leaves, not pinned to the edge
        const free = W - (t.x + w) - A;
        if (free > m * 4) ax = t.x + w + free * 0.55;
      }
      return { W, H, vmin, m, sb, A, ax, ay, t, portrait };
    }

    function place(g) {
      rs.setProperty("--sb", g.sb + "px");
      rs.setProperty("--tx", g.t.x + "px"); rs.setProperty("--ty", g.t.y + "px");
      rs.setProperty("--tw", g.t.w + "px"); rs.setProperty("--tb", g.t.b + "px");
    }

    // ---------- the art ----------
    const hexRGB = (h) => { h = String(h || "#000").replace("#", ""); if (h.length === 3) h = h.replace(/./g, "$&$&"); const n = parseInt(h, 16) || 0; return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
    const lumOf = (r, g, b) => 0.2126 * r + 0.7152 * g + 0.0722 * b;

    async function loadCover(url) {
      const im = new Image();
      im.src = url;
      await im.decode();
      return im;
    }

    function drawArt(ctx) {
      if (!img) return;
      const g = geometry(ctx);
      place(g);
      const P = ctx.params, dpr = Math.max(1, window.devicePixelRatio || 1);
      const family = (Wallpaper.fonts[P.font] || P.font || "ui-monospace") + ", ui-monospace, Menlo, monospace";
      const key = [imgKey, g.W, g.H, dpr, g.A, P.columns, P.ramp, P.art, P.prompt, P.screen, family].join("|");
      if (key === drawnKey) return;
      drawnKey = key;

      const ramp = RAMPS[P.ramp] || RAMPS.classic, n = ramp.length;
      const cols = Math.max(24, Math.round(+P.columns || 96));
      const cw = g.A / cols, ch = cw / 0.6, rows = Math.max(8, Math.floor(g.A / ch));
      const artH = rows * ch;
      for (const c of [$("base"), $("bright")]) {
        Object.assign(c.style, { left: g.ax + "px", top: g.ay + (g.A - artH) / 2 + "px", width: g.A + "px", height: artH + "px" });
        c.width = Math.round(g.A * dpr); c.height = Math.round(artH * dpr);
      }

      // sample the cover: one pixel per character cell (a square crop of a non-square cover)
      const sc = document.createElement("canvas");
      sc.width = cols; sc.height = rows;
      const sg = sc.getContext("2d", { willReadFrequently: true });
      sg.imageSmoothingQuality = "high";
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      // step down in halves first, so the small sample averages its area instead of picking single pixels
      let from = img, fw = s, fh = s, fx = (img.naturalWidth - s) / 2, fy = (img.naturalHeight - s) / 2;
      while (fw > cols * 4) {
        const t = document.createElement("canvas");
        t.width = Math.max(cols, Math.round(fw / 2)); t.height = Math.max(rows, Math.round(fh / 2));
        const tg = t.getContext("2d"); tg.imageSmoothingQuality = "high";
        tg.drawImage(from, fx, fy, fw, fh, 0, 0, t.width, t.height);
        from = t; fx = 0; fy = 0; fw = t.width; fh = t.height;
      }
      sg.drawImage(from, fx, fy, fw, fh, 0, 0, cols, rows);
      const d = sg.getImageData(0, 0, cols, rows).data;

      // auto-levels on brightness, so murky and pale covers still use the whole ramp
      const L = new Float32Array(cols * rows);
      // brightness for the ramp: luminance mixed with the brightest channel, so deep saturated blues and reds still get ink
      for (let i = 0; i < L.length; i++) { const r = d[i * 4], gg = d[i * 4 + 1], b = d[i * 4 + 2]; L[i] = 0.55 * lumOf(r, gg, b) + 0.45 * Math.max(r, gg, b); }
      const sorted = Float32Array.from(L).sort();
      const lo = sorted[Math.floor(sorted.length * 0.02)], hi = sorted[Math.floor(sorted.length * 0.99)];
      const span = Math.max(48, hi - lo), floor = Math.max(0, Math.min(lo, 255 - span));

      const phosphor = P.art === "phosphor", pc = hexRGB(P.prompt), bg = hexRGB(P.screen);
      const bgLum = lumOf(...bg) / 255;
      for (const [id, step] of [["base", 0], ["bright", 1]]) {
        const c = $(id), cg = c.getContext("2d");
        cg.setTransform(dpr, 0, 0, dpr, 0, 0);
        cg.clearRect(0, 0, g.A, artH);
        // size the font so one character advance is exactly one cell
        cg.font = `700 100px ${family}`;
        const adv = cg.measureText("M").width / 100 || 0.6;
        cg.font = `700 ${(cw / adv).toFixed(2)}px ${family}`;
        cg.textAlign = "center"; cg.textBaseline = "middle";
        let last = "";
        for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
          const i = y * cols + x, o = i * 4;
          const v = Math.pow(Math.min(1, Math.max(0, (L[i] - floor) / span)), 0.82);
          let k = Math.min(n - 1, Math.round(v * (n - 1)) + step);
          let r, gg, b, a = 1;
          if (phosphor) {
            const f = 0.32 + 0.68 * v + step * 0.12;
            r = pc[0] * f; gg = pc[1] * f; b = pc[2] * f;
          } else {
            // the pixel's colour, lifted so thin glyphs on a dark screen still read as that colour
            r = d[o]; gg = d[o + 1]; b = d[o + 2];
            // more saturated than the cover: thin glyphs on black wash colours out
            const gr = (r + gg + b) / 3, sat = 1.45;
            r = Math.max(0, gr + (r - gr) * sat); gg = Math.max(0, gr + (gg - gr) * sat); b = Math.max(0, gr + (b - gr) * sat);
            const mx = Math.max(r, gg, b, 1), lift = Math.max(1, (110 + 120 * v) / mx);
            r = Math.min(255, r * lift); gg = Math.min(255, gg * lift); b = Math.min(255, b * lift);
            const w = 0.06 + step * 0.22;
            r += (255 - r) * w; gg += (255 - gg) * w; b += (255 - b) * w;
          }
          let chr = ramp[k];
          if (k === 0) {
            if (step) continue;
            // the empty screen keeps a faint dot, so the picture's square still reads in its dark parts
            chr = "·"; a = 0.16;
          }
          const col = `rgba(${r | 0},${gg | 0},${b | 0},${a})`;
          if (col !== last) { cg.fillStyle = col; last = col; }
          cg.fillText(chr, (x + 0.5) * cw, (y + 0.5) * ch);
        }
        // phosphor bloom: the art blurred (by scaling it down and back up) and added on top, once
        if (bgLum < 0.5) {
          const sm = document.createElement("canvas");
          sm.width = Math.max(1, Math.round(c.width / 8)); sm.height = Math.max(1, Math.round(c.height / 8));
          const smg = sm.getContext("2d"); smg.imageSmoothingQuality = "high";
          smg.drawImage(c, 0, 0, sm.width, sm.height);
          cg.setTransform(1, 0, 0, 1, 0, 0);
          cg.globalCompositeOperation = "lighter"; cg.globalAlpha = 0.34 + step * 0.1;
          cg.imageSmoothingQuality = "high";
          cg.drawImage(sm, 0, 0, c.width, c.height);
          cg.globalCompositeOperation = "source-over"; cg.globalAlpha = 1;
        }
      }
    }

    // ---------- the shell ----------
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    let histKey = null, shownIndex = null, typing = null, typedKey = null;

    function progress(ctx) {
      const N = 26, p = ctx.track.progress || 0, on = Math.round(p * N);
      return `<span class="on">${"█".repeat(on)}</span><span class="off">${"█".repeat(N - on)}</span>  ${ctx.track.elapsed} / ${ctx.track.length}`;
    }

    function buildHistory(ctx) {
      const L = ctx.lyrics, hist = $("hist");
      const before = Math.max(0, Math.round(+(ctx.params.history ?? 4)));
      const key = [ctx.track.id, L.index, L.lines.length, ctx.focus, before].join("|");
      if (key === histKey) return null;
      const prevIndex = shownIndex, sameTrack = histKey && histKey.split("|")[0] === String(ctx.track.id);
      // FLIP: where the line that was current sits now, so the history can glide up into place
      const oldEl = hist.querySelector(".cur"), oldTop = oldEl ? oldEl.getBoundingClientRect().top : null;
      histKey = key; shownIndex = L.index;

      let html = "";
      let cur = null;
      if (ctx.focus) {
        html = `<div class="p"><span class="ps">~/music</span> <span class="dim">$</span> clear</div>`;
        html += `<div class="cur" data-i="${L.index}"><span class="ps">$</span> <span class="typed"></span><span class="caret"></span></div>`;
      } else if (!L.hasLyrics) {
        html = `<div class="p"><span class="ps">~/music</span> <span class="dim">$</span> lyrics --follow</div>`;
        html += `<div class="cmt"># no lyrics for this one. just listen</div>`;
        html += `<div class="cur" data-i="-1"><span class="ps">$</span> <span class="typed"></span><span class="caret"></span></div>`;
      } else {
        html = `<div class="p"><span class="ps">~/music</span> <span class="dim">$</span> lyrics --follow</div>`;
        const past = [];
        for (let k = L.index - 1; k >= 0 && past.length < before; k--) if (L.lines[k].text.trim()) past.unshift(k);
        for (const k of past) html += `<div class="past" data-i="${k}"><span class="note">♪</span>${esc(L.lines[k].text)}</div>`;
        if (L.index < 0) {
          html += `<div class="cmt"># waiting for the first line…</div>`;
        } else if (L.isInstrumental) {
          html += `<div class="cmt"># instrumental</div>`;
        } else {
          cur = L.current;
        }
        html += `<div class="cur" data-i="${L.index}"><span class="note">♪</span><span class="typed"></span><span class="caret"></span></div>`;
      }
      hist.innerHTML = html;
      if (Wallpaper.live && sameTrack && oldTop != null && prevIndex != null && L.index > prevIndex) {
        const moved = hist.querySelector(`[data-i="${prevIndex}"]`);
        const dy = moved ? oldTop - moved.getBoundingClientRect().top : hist.lastElementChild.getBoundingClientRect().height;
        if (dy > 0) hist.animate([{ transform: `translateY(${dy}px)` }, { transform: "translateY(0)" }], { duration: 420, easing: "cubic-bezier(0.22, 1, 0.36, 1)" });
      }
      return { text: cur || "", key };
    }

    function type(text, key) {
      clearInterval(typing); typing = null;
      const el = $("hist").querySelector(".typed");
      if (!el) return;
      typedKey = key;
      if (!Wallpaper.live || Wallpaper.paused || !text) { el.textContent = text; return; }
      // a quick typist: the whole line lands in about a second, a few characters per keystroke on long lines
      const steps = Math.min(text.length, 34), per = Math.ceil(text.length / steps);
      let n = 0;
      el.textContent = "";
      typing = setInterval(() => {
        n = Math.min(text.length, n + per);
        el.textContent = text.slice(0, n);
        if (n >= text.length) { clearInterval(typing); typing = null; }
      }, 30);
    }
    function finishTyping() {
      if (!typing) return;
      clearInterval(typing); typing = null;
      const el = $("hist").querySelector(".typed"), L = Wallpaper.ctx && Wallpaper.ctx.lyrics;
      if (el && L && !Wallpaper.ctx.focus && L.index >= 0 && !L.isInstrumental) el.textContent = L.current;
    }

    function statusText(ctx) {
      return `"${ctx.track.artist || "Spotify"}"  ${ctx.time.clock24}  ${ctx.time.day}`;
    }

    // ---------- hooks ----------
    Wallpaper.on("render", (ctx) => {
      lastCtx = ctx;
      const tall = innerWidth / innerHeight < 1.05;
      $("title").setAttribute("max", tall ? "7.5vmin" : innerWidth / innerHeight > 2 ? "8.5vmin" : "7vmin");
      const meta = [ctx.track.artist, ctx.track.album].filter(Boolean).map(esc);
      $("meta").innerHTML = meta.length ? `<b>${meta[0]}</b>${meta[1] ? " · " + meta[1] : ""}` : "";
      $("prog").innerHTML = progress(ctx);
      $("status").textContent = statusText(ctx);
      const h = buildHistory(ctx);
      if (h) type(h.text, h.key);

      const want = ctx.track.coverKey || ctx.track.cover;
      if (ctx.track.cover && want !== imgKey) {
        const url = ctx.track.cover;
        Wallpaper.hold(loadCover(url).then((im) => {
          if ((Wallpaper.ctx.track.coverKey || Wallpaper.ctx.track.cover) !== want) return;
          img = im; imgKey = want; drawnKey = null;
        }).catch(() => {}));
      }
    });
    Wallpaper.on("layout", (ctx) => drawArt(ctx));
    Wallpaper.on("tick", (ctx) => {
      const p = progress(ctx);
      if ($("prog").innerHTML !== p) $("prog").innerHTML = p;
      const s = statusText(ctx);
      if ($("status").textContent !== s) $("status").textContent = s;
    });
    Wallpaper.on("beat", (b) => {
      if (Wallpaper.paused || !lastCtx || lastCtx.params.beat === false || !img) return;
      const el = $("bright");
      el.getAnimations().forEach((a) => a.cancel());
      el.animate([{ opacity: Math.min(1, 0.2 + 0.6 * (b.strength || 0.6)) }, { opacity: 0 }],
        { duration: 460, easing: "cubic-bezier(0.2, 0.7, 0.3, 1)" });
    });
    Wallpaper.on("pause", () => { finishTyping(); $("bright").getAnimations().forEach((a) => a.cancel()); });
    addEventListener("resize", () => { drawnKey = null; Wallpaper.refresh(); });
  </script>
</body>
</html>
