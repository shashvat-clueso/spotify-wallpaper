<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/runtime/runtime.css">
<script src="/runtime/runtime.js"></script>
<script src="dotmatrix.js"></script>
<style>
  /* The device is 100u wide (2.1:1). --pitch, the grille's hole spacing, is set from the "Grille holes" setting. */
  :root { --dw: min(84vw, 160vh); --u: calc(var(--dw) / 100); --pitch: 20px; --accent: var(--param-accent); }
  body { background: var(--param-room); font-family: -apple-system, system-ui, sans-serif; }
  .desk { position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 35% 20%, color-mix(in oklab, var(--param-room), #fff 45%), transparent 70%),
      radial-gradient(ellipse 120% 90% at 50% 50%, transparent 45%, color-mix(in oklab, var(--param-room), #000 22%)); }
  .sw-grain { opacity: 0.06; }

  .stage { position: absolute; inset: 0; display: grid; place-items: center; }
  .dev { position: relative; width: var(--dw); aspect-ratio: 2.1; border-radius: calc(var(--u) * 2.6);
    background:
      linear-gradient(180deg, color-mix(in oklab, var(--param-body), #fff 55%) 0, var(--param-body) 3%, var(--param-body) 70%, color-mix(in oklab, var(--param-body), #000 7%));
    box-shadow:
      inset 0 calc(var(--u) * 0.18) 0 rgba(255, 255, 255, 0.85), inset 0 calc(var(--u) * -0.35) 0 rgba(0, 0, 0, 0.08),
      0 calc(var(--u) * 0.25) calc(var(--u) * 0.4) rgba(0, 0, 0, 0.12),
      0 calc(var(--u) * 3) calc(var(--u) * 6) calc(var(--u) * -1.5) rgba(0, 0, 0, 0.38),
      0 calc(var(--u) * 7) calc(var(--u) * 12) calc(var(--u) * -4) rgba(0, 0, 0, 0.25);
    display: grid; grid-template-columns: 0.9fr 1.1fr; gap: calc(var(--u) * 3.4); padding: calc(var(--u) * 3.6) calc(var(--u) * 3.6) calc(var(--u) * 5.2); }
  /* the seam around the face plate */
  .dev::before { content: ""; position: absolute; inset: calc(var(--u) * 1.2); border-radius: calc(var(--u) * 1.6); pointer-events: none;
    box-shadow: inset 0 0 0 calc(var(--u) * 0.08) rgba(0, 0, 0, 0.07), 0 calc(var(--u) * 0.08) 0 rgba(255, 255, 255, 0.6); }

  /* ---------- the speaker grille, with the cover behind it ---------- */
  .grille { position: relative; border-radius: calc(var(--u) * 1.5); overflow: hidden;
    background: radial-gradient(ellipse 90% 70% at 30% 20%, #2e2e2e, #121212 70%);
    box-shadow: inset 0 calc(var(--u) * 0.3) calc(var(--u) * 0.6) rgba(0, 0, 0, 0.7), 0 calc(var(--u) * 0.12) 0 rgba(255, 255, 255, 0.8); }
  .holes { position: absolute; inset: calc(var(--u) * 1.4);
    -webkit-mask:
      radial-gradient(circle, #000 calc(var(--pitch) * 0.36), transparent calc(var(--pitch) * 0.4)) 0 0 / var(--pitch) calc(var(--pitch) * 1.732),
      radial-gradient(circle, #000 calc(var(--pitch) * 0.36), transparent calc(var(--pitch) * 0.4)) calc(var(--pitch) * 0.5) calc(var(--pitch) * 0.866) / var(--pitch) calc(var(--pitch) * 1.732);
    mask:
      radial-gradient(circle, #000 calc(var(--pitch) * 0.36), transparent calc(var(--pitch) * 0.4)) 0 0 / var(--pitch) calc(var(--pitch) * 1.732),
      radial-gradient(circle, #000 calc(var(--pitch) * 0.36), transparent calc(var(--pitch) * 0.4)) calc(var(--pitch) * 0.5) calc(var(--pitch) * 0.866) / var(--pitch) calc(var(--pitch) * 1.732); }
  .holes .art { position: absolute; inset: -4%; background: var(--cover-url) center / cover, #333;
    transform: scale(calc(1 + var(--beat) * 0.045 * var(--param-thump))); filter: saturate(1.2) brightness(1.18); }
  .sw-live .holes .art { will-change: transform; }
  /* each hole's rim: a little shade so the perforation reads as depth */
  .holes .rim { position: absolute; inset: 0;
    background:
      radial-gradient(circle at 50% 35%, transparent calc(var(--pitch) * 0.26), rgba(0, 0, 0, 0.32) calc(var(--pitch) * 0.4)) 0 0 / var(--pitch) calc(var(--pitch) * 1.732),
      radial-gradient(circle at 50% 35%, transparent calc(var(--pitch) * 0.26), rgba(0, 0, 0, 0.32) calc(var(--pitch) * 0.4)) calc(var(--pitch) * 0.5) calc(var(--pitch) * 0.866) / var(--pitch) calc(var(--pitch) * 1.732); }
  .grille .sheen { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(125deg, rgba(255, 255, 255, 0.12), transparent 35%, transparent 70%, rgba(255, 255, 255, 0.05)); }

  /* ---------- the right half: display and knobs ---------- */
  .right { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: calc(var(--u) * 3); min-width: 0; }
  .oled { position: relative; border-radius: calc(var(--u) * 1.1); background: #050505; padding: calc(var(--u) * 1.9) calc(var(--u) * 2.2);
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: calc(var(--u) * 1.2); min-height: 0;
    box-shadow: inset 0 calc(var(--u) * 0.3) calc(var(--u) * 0.6) rgba(0, 0, 0, 0.9), 0 0 0 calc(var(--u) * 0.45) #1b1b1b,
      0 0 0 calc(var(--u) * 0.55) rgba(0, 0, 0, 0.15), 0 calc(var(--u) * 0.2) 0 calc(var(--u) * 0.55) rgba(255, 255, 255, 0.7); }
  .oled::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.07), transparent 38%); }
  .oled canvas { display: block; width: 100%; min-width: 0; }
  .oled .top { height: calc(var(--u) * 1.3); }
  .oled .main { height: 100%; min-height: 0; filter: drop-shadow(0 0 calc(var(--u) * 0.25) rgba(255, 255, 255, 0.35)); }
  .segs { display: flex; gap: calc(var(--u) * 0.35); }
  .segs i { flex: 1; height: calc(var(--u) * 0.55); border-radius: calc(var(--u) * 0.1); background: #222; }
  .segs i.on { background: var(--accent); box-shadow: 0 0 calc(var(--u) * 0.4) color-mix(in srgb, var(--accent) 60%, transparent); }

  .knobs { display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(var(--u) * 1.6); }
  .knob { display: grid; justify-items: center; gap: calc(var(--u) * 0.9); font: 600 calc(var(--u) * 0.95) / 1 ui-monospace, "SF Mono", Menlo, monospace; color: #77786f; letter-spacing: 0.16em; }
  .well { position: relative; width: calc(var(--u) * 8.4); aspect-ratio: 1; display: grid; place-items: center; }
  /* the printed scale around each knob: 270° of ticks */
  .well::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: repeating-conic-gradient(from -135deg, #8d8e86 0 1.4deg, transparent 1.4deg 27deg);
    -webkit-mask: radial-gradient(circle, transparent 60%, #000 61% 70%, transparent 71%), conic-gradient(from -137deg, #000 0 274deg, transparent 274deg);
    -webkit-mask-composite: source-in; mask-composite: intersect; }
  .skirt { position: absolute; width: 74%; aspect-ratio: 1; border-radius: 50%;
    background: repeating-conic-gradient(color-mix(in oklab, var(--k), #000 35%) 0 4deg, color-mix(in oklab, var(--k), #000 12%) 4deg 8deg);
    box-shadow: 0 calc(var(--u) * 0.5) calc(var(--u) * 0.8) rgba(0, 0, 0, 0.35), 0 calc(var(--u) * 0.15) calc(var(--u) * 0.2) rgba(0, 0, 0, 0.3); }
  .cap { position: absolute; width: 60%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 38% 30%, color-mix(in oklab, var(--k), #fff 32%), var(--k) 52%, color-mix(in oklab, var(--k), #000 18%));
    box-shadow: inset 0 calc(var(--u) * 0.12) 0 rgba(255, 255, 255, 0.35), inset 0 calc(var(--u) * -0.15) calc(var(--u) * 0.2) rgba(0, 0, 0, 0.25); }
  .turn { position: absolute; width: 60%; aspect-ratio: 1; transform: rotate(var(--a, -135deg)); }
  .sw-live .turn:not([data-follow]) { transition: transform 1.1s cubic-bezier(0.3, 0.7, 0.2, 1); }
  .turn::after { content: ""; position: absolute; left: 50%; top: 7%; width: 9%; height: 30%; margin-left: -4.5%; border-radius: 99px; background: var(--dot, rgba(255, 255, 255, 0.92)); }
  .turn.song { animation: sweep 1s linear both paused; }
  @keyframes sweep { from { transform: rotate(-135deg); } to { transform: rotate(135deg); } }

  .badge { position: absolute; left: calc(var(--u) * 3.6); bottom: calc(var(--u) * 1.9); font: 600 calc(var(--u) * 0.9) / 1 ui-monospace, "SF Mono", Menlo, monospace;
    color: #9a9b93; letter-spacing: 0.2em; text-transform: uppercase; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8); white-space: nowrap; }
  .badge b { color: #6b6c64; font-weight: 700; }
  .led { position: absolute; right: calc(var(--u) * 3.6); bottom: calc(var(--u) * 2.1); display: flex; align-items: center; gap: calc(var(--u) * 0.8);
    font: 600 calc(var(--u) * 0.9) / 1 ui-monospace, "SF Mono", Menlo, monospace; color: #9a9b93; letter-spacing: 0.2em; }
  .led i { width: calc(var(--u) * 0.9); aspect-ratio: 1; border-radius: 50%; background: var(--accent);
    opacity: calc(0.55 + var(--beat) * 0.45); box-shadow: 0 0 calc(var(--u) * (0.4 + var(--beat) * 1.2)) var(--accent); }
  html:not(.is-playing) .led i { opacity: 0.2; box-shadow: none; }

  /* portrait: the grille on top, the display and knobs below */
  @media (max-aspect-ratio: 1/1) {
    :root { --dw: min(86vw, 52vh); }
    .dev { aspect-ratio: 0.6; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); padding-bottom: calc(var(--u) * 9); }
    .grille { aspect-ratio: 1; }
    .knob { font-size: calc(var(--u) * 2); }
    .well { width: calc(var(--u) * 16); }
    .oled .top { height: calc(var(--u) * 2.6); }
    .badge, .led { font-size: calc(var(--u) * 2); bottom: calc(var(--u) * 3.6); }
    .badge { left: calc(var(--u) * 5); }
    .led { right: calc(var(--u) * 5); }
    .segs i { height: calc(var(--u) * 1); }
  }
</style>
</head>
<body>
  <div class="desk"></div>
  <div class="stage">
    <div class="dev">
      <div class="grille"><div class="holes"><div class="art"></div><div class="rim"></div></div><div class="sheen"></div></div>
      <div class="right">
        <div class="oled">
          <canvas class="top" id="top"></canvas>
          <canvas class="main" id="main"></canvas>
          <div class="segs" id="segs"></div>
        </div>
        <div class="knobs">
          <div class="knob"><div class="well"><div class="skirt"></div><div class="cap"></div><div class="turn song" data-follow="song"></div></div>POS</div>
          <div class="knob"><div class="well"><div class="skirt"></div><div class="cap"></div><div class="turn" id="kLine"></div></div>LINE</div>
          <div class="knob"><div class="well"><div class="skirt"></div><div class="cap"></div><div class="turn" id="kHue"></div></div>HUE</div>
          <div class="knob"><div class="well"><div class="skirt"></div><div class="cap"></div><div class="turn" id="kBpm"></div></div>BPM</div>
        </div>
      </div>
      <div class="badge"><b>SW-1</b> · Now playing device</div>
      <div class="led"><span id="ledLabel">PLAY</span><i></i></div>
    </div>
  </div>
  <div class="sw-grain" data-show="params.grain"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const segs = $("segs");
    for (let i = 0; i < 28; i++) segs.appendChild(document.createElement("i"));

    const rgb = (h) => { h = String(h || "#888").replace("#", ""); if (h.length === 3) h = h.replace(/./g, "$&$&"); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
    const chroma = (h) => { const c = rgb(h); return Math.max(...c) - Math.min(...c); };
    const dist = (a, b) => { const x = rgb(a), y = rgb(b); return Math.abs(x[0] - y[0]) + Math.abs(x[1] - y[1]) + Math.abs(x[2] - y[2]); };
    const light = (h) => { const [r, g, b] = rgb(h); return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255; };
    function hue(h) {
      const [r, g, b] = rgb(h).map((v) => v / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
      if (!d) return 0;
      const x = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      return x * 60;
    }

    // Four knob colours: the cover's most distinct swatches, most colourful first; a plain cover is filled out with
    // the classic grey, black and the display's orange.
    function knobColours(ctx) {
      const classic = ["#D8D7D0", "#2B2B2A", "#8E8F88", ctx.params.accent || "#FF6A2B"];
      if (ctx.params.knobs === "classic") return classic;
      const pal = [...(ctx.colors.palette || []), ctx.colors.vibrant].filter(Boolean).sort((a, b) => chroma(b) - chroma(a));
      const out = [];
      for (const c of pal) if (out.every((o) => dist(o, c) > 70)) out.push(c);
      for (const c of classic) if (out.length < 4 && out.every((o) => dist(o, c) > 70)) out.push(c);
      while (out.length < 4) out.push(classic[out.length]);
      return out.slice(0, 4);
    }

    function oledText(ctx) {
      const L = ctx.lyrics;
      if (ctx.focus || !L.hasLyrics) return ctx.track.title;
      if (L.index < 0) return ctx.track.title;
      if (L.isInstrumental) return "· instrumental ·";
      return L.current;
    }

    // the lyric, as large as it fits in up to four rows
    function drawMain(ctx) {
      const c = $("main"), W = c.clientWidth, H = c.clientHeight, text = oledText(ctx);
      if (!W || !H) return;
      let pitch = Math.min(H / 9, W / 40), lines = [];
      for (; pitch > 1.5; pitch *= 0.93) {
        const cols = Math.floor(W / pitch) - 1, rowsFit = Math.min(text.length > 48 ? 4 : 3, Math.floor((Math.floor(H / pitch) + 3) / 10));
        lines = DotMatrix.wrap(text, cols, 99);
        if (lines.length <= Math.max(1, rowsFit) && lines.every((l) => DotMatrix.measure(l) <= cols)) break;
      }
      const cols = Math.floor(W / pitch) - 1, rowsFit = Math.max(1, Math.min(text.length > 48 ? 4 : 3, Math.floor((Math.floor(H / pitch) + 3) / 10)));
      lines = DotMatrix.wrap(text, cols, rowsFit);
      DotMatrix.draw(c, "", { lines, pitch, color: "#f4f3ee", off: "rgba(255,255,255,0.035)", align: "left", gap: 3 });
    }

    let topText = "";
    function drawTop(ctx, force) {
      const c = $("top"), p = c.clientHeight / 8;
      const right = ctx.track.elapsed;
      const left = DotMatrix.wrap(ctx.track.artist || "", Math.floor(c.clientWidth / p) - DotMatrix.measure(right) - 8, 1)[0] || "";
      const key = left + "|" + right + "|" + c.clientWidth;
      if (key === topText && !force) return;
      topText = key;
      DotMatrix.draw(c, left, { pitch: p, color: "#8a8a86" });
      DotMatrix.draw(c, right, { pitch: p, color: "#8a8a86", align: "right", clear: false });
    }

    function setSegs(ctx) {
      const n = segs.children.length, on = Math.round((ctx.track.progress || 0) * n);
      [...segs.children].forEach((s, k) => s.classList.toggle("on", k < on));
    }

    let bpmShown = -1;
    function setBpm() {
      const bpm = Wallpaper.beat.bpm || 0;
      if (Math.round(bpm) === bpmShown) return;
      bpmShown = Math.round(bpm);
      const a = bpm ? -135 + Math.max(0, Math.min(1, (bpm - 60) / 120)) * 270 : -135;
      $("kBpm").style.setProperty("--a", a.toFixed(1) + "deg");
    }

    Wallpaper.on("render", (ctx) => {
      const s = document.documentElement.style;
      // the grille's holes: a whole number across the grille
      const grille = document.querySelector(".holes");
      const holes = Math.max(12, +ctx.params.grille || 44);
      s.setProperty("--pitch", (grille.clientWidth / holes).toFixed(2) + "px");
      knobColours(ctx).forEach((c, k) => {
        const w = document.querySelectorAll(".well")[k];
        w.style.setProperty("--k", c);
        w.style.setProperty("--dot", light(c) > 0.7 ? "rgba(0,0,0,0.75)" : "rgba(255,255,255,0.92)");
      });
      const L = ctx.lyrics, n = Math.max(1, L.lines.length - 1);
      $("kLine").style.setProperty("--a", (-135 + (Math.max(0, L.index) / n) * 270).toFixed(1) + "deg");
      $("kHue").style.setProperty("--a", (-135 + (hue(ctx.colors.vibrant || "#888") / 360) * 270).toFixed(1) + "deg");
      $("ledLabel").textContent = ctx.track.isPlaying === false ? "PAUSE" : "PLAY";
      setBpm();
      setSegs(ctx);
    });
    Wallpaper.on("layout", (ctx) => { drawMain(ctx); drawTop(ctx, true); });
    Wallpaper.on("tick", (ctx) => { drawTop(ctx); setSegs(ctx); });
    Wallpaper.on("beat", setBpm);
    addEventListener("resize", () => Wallpaper.refresh());
  </script>
</body>
</html>
