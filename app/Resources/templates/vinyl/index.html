<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/runtime/runtime.css">
<script src="/runtime/runtime.js"></script>
<style>
  body { background: #0a0a0b; color: #fff; font-family: var(--param-font); }
  .bg { position: absolute; inset: -12%; background: center / cover no-repeat; }
  .shade { position: absolute; inset: 0; background: #000; opacity: var(--param-dim); }
  .layout { position: absolute; inset: 0; display: flex; align-items: center; gap: 6vw; padding: 0 6vw; }

  .deck { position: relative; width: var(--param-recordSize); height: var(--param-recordSize); flex: none; }
  .record { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 3vmin 9vmin rgba(0,0,0,.55);
    background:
      conic-gradient(from 30deg, rgba(255,255,255,.12), transparent 10%, rgba(255,255,255,.07) 24%, transparent 38%,
        rgba(255,255,255,.12) 50%, transparent 60%, rgba(255,255,255,.07) 74%, transparent 88%, rgba(255,255,255,.12)),
      repeating-radial-gradient(circle, #111 0 0.3vmin, #1b1b1b 0.4vmin 0.55vmin),
      #0f0f0f; }
  .groove-gap { position: absolute; inset: 31%; border-radius: 50%; border: 0.25vmin solid rgba(255,255,255,.05); }
  .label { position: absolute; inset: 32%; border-radius: 50%; background: var(--cover-url) center / cover; box-shadow: inset 0 0 0 0.4vmin rgba(0,0,0,.35); }
  .hole { position: absolute; inset: 48.8%; border-radius: 50%; background: #0a0a0a; }
  .sheen { position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(135deg, rgba(255,255,255,.10), transparent 40%, transparent 60%, rgba(255,255,255,.05)); pointer-events: none; }

  .sw-live .spin { animation: spin var(--spin, 1.8s) linear infinite; }
  .sw-live:not(.is-playing) .spin { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .arm { position: absolute; right: -6%; top: -4%; width: 34%; height: 78%; transform-origin: 78% 10%; transform: rotate(-26deg);
    transition: transform 1.2s cubic-bezier(.3,1.4,.4,1); }
  .is-playing .arm, :not(.sw-live) .arm { transform: rotate(0deg); }
  .arm .pivot { position: absolute; right: 12%; top: 3%; width: 22%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #d8d8d8, #7a7a7a); box-shadow: 0 1vmin 2vmin rgba(0,0,0,.5); }
  .arm .rod { position: absolute; right: 21%; top: 10%; width: 3.5%; height: 78%; background: linear-gradient(90deg, #9a9a9a, #e6e6e6, #8a8a8a); border-radius: 1vmin; transform: rotate(16deg); transform-origin: top; }
  .arm .head { position: absolute; left: 30%; bottom: 3%; width: 16%; height: 12%; background: linear-gradient(#cfcfcf, #8d8d8d); border-radius: 0.6vmin; transform: rotate(16deg); }

  .side { flex: 1; min-width: 0; height: 78vh; display: flex; flex-direction: column; }
  .title { font-weight: 700; font-size: 3vmin; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-weight: 500; font-size: 2.2vmin; opacity: .6; margin: .6vmin 0 3vmin; }
  lyrics-block { flex: 1; min-height: 0; -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent); }
  lyrics-block .line { font-weight: 800; font-size: var(--param-lyricSize); line-height: 1.15; margin-bottom: 2.6vmin;
    opacity: calc(0.45 * pow(0.72, var(--dist) - 1)); }
  lyrics-block .past { opacity: calc(0.2 * pow(0.6, var(--dist) - 1)); }
  lyrics-block .current { opacity: 1; }
  lyrics-block.karaoke { --karaoke-on: #fff; --karaoke-off: rgba(255,255,255,.42); }
  .empty { flex: 1; font-size: 3.6vmin; font-weight: 600; opacity: .45; }
</style>
</head>
<body>
  <div class="bg" data-cover-blur="params.blur" data-cover-saturate="1.3"></div>
  <div class="shade"></div>
  <div class="sw-grain" data-show="params.grain"></div>
  <div class="layout">
    <div class="deck">
      <div class="record spin"><div class="groove-gap"></div><div class="label"></div><div class="hole"></div></div>
      <div class="sheen"></div>
      <div class="arm" data-show="params.tonearm"><div class="rod"></div><div class="head"></div><div class="pivot"></div></div>
    </div>
    <div class="side">
      <div class="title" data-bind="track.title"></div>
      <div class="artist" data-bind="track.artist"></div>
      <lyrics-block layout="center" before="2" after="3" data-attr-class="params.karaoke|kclass"></lyrics-block>
      <div class="empty" data-show="!lyrics.hasLyrics">No lyrics found</div>
    </div>
  </div>
  <script>
    // seconds per turn from the chosen speed
    Wallpaper.on("render", (ctx) => {
      document.documentElement.style.setProperty("--spin", (60 / +ctx.params.rpm).toFixed(2) + "s");
    });
  </script>
</body>
</html>
