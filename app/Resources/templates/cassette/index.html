<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/runtime/runtime.css">
<script src="/runtime/runtime.js"></script>
<style>
  /* Everything is measured in --u, so the cassette and its case scale together on any screen. The scene is 120u wide. */
  :root { --u: min(1vh, calc(86vw / 120)); --hand: var(--param-hand); }
  body { background: var(--param-background); color: #fff; font-family: -apple-system, system-ui, sans-serif; }
  .room { position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 30% 22%, color-mix(in oklab, var(--param-background), #fff 16%), transparent 70%),
      radial-gradient(ellipse 40% 45% at 30% 60%, color-mix(in oklab, var(--param-accent) 22%, transparent), transparent 70%),
      radial-gradient(ellipse 90% 80% at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.55)); }
  .sw-grain { opacity: 0.11; }

  .scene { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

  /* ---------- case insert (J-card) ---------- */
  .jcard { position: relative; flex: none; width: calc(var(--u) * 40); height: calc(var(--u) * 62); margin-right: calc(var(--u) * -5);
    transform: rotate(3deg) translateY(calc(var(--u) * -3)); z-index: 0; }
  .case { position: absolute; inset: 0; border-radius: calc(var(--u) * 0.9); overflow: hidden; background: var(--param-label);
    box-shadow: 0 calc(var(--u) * 2.4) calc(var(--u) * 6) rgba(0, 0, 0, 0.45), 0 calc(var(--u) * 0.4) calc(var(--u) * 1) rgba(0, 0, 0, 0.3); }
  .art { position: absolute; left: 0; top: 0; width: 100%; aspect-ratio: 1; background: var(--cover-url) center / cover, var(--param-shell); }
  .band { position: absolute; left: 0; right: 0; top: calc(var(--u) * 40); bottom: 0; padding: calc(var(--u) * 2.4) calc(var(--u) * 2.6);
    background: var(--param-label); color: color-mix(in oklab, var(--param-label), #000 82%); display: flex; flex-direction: column; }
  .band .stripe { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--u) * 0.9); background: var(--param-accent); }
  .band .who { font: 700 calc(var(--u) * 1.35) / 1.2 "Avenir Next", Avenir, sans-serif; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.7;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: calc(var(--u) * 0.6); }
  .band .what { font: 600 calc(var(--u) * 3.1) / 1.08 Didot, "Bodoni 72", serif; margin-top: calc(var(--u) * 1); letter-spacing: -0.01em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .band .small { margin-top: auto; display: flex; justify-content: space-between; gap: calc(var(--u) * 2);
    font: 600 calc(var(--u) * 1.1) / 1.2 "Avenir Next", Avenir, sans-serif; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5; }
  .band .small span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* the clear plastic box: a hinge on the left and one soft reflection */
  .case::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 0 0 calc(var(--u) * 0.35) rgba(255, 255, 255, 0.22), inset calc(var(--u) * 1.4) 0 0 rgba(255, 255, 255, 0.07);
    background: linear-gradient(118deg, transparent 18%, rgba(255, 255, 255, 0.2) 30%, rgba(255, 255, 255, 0.04) 46%, transparent 58%); }

  /* ---------- the cassette ---------- */
  .deck { position: relative; flex: none; z-index: 1; }
  .cassette { position: relative; width: calc(var(--u) * 84); height: calc(var(--u) * 53.4); border-radius: calc(var(--u) * 2.6);
    transform: rotate(calc(var(--param-tilt) + var(--beat) * 0.5deg)) scale(calc(1 + var(--beat) * 0.006));
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0) 12%, rgba(0, 0, 0, 0) 80%, rgba(0, 0, 0, 0.28)),
      var(--param-shell);
    box-shadow:
      0 calc(var(--u) * 3) calc(var(--u) * 7) rgba(0, 0, 0, 0.5), 0 calc(var(--u) * 0.5) calc(var(--u) * 1.2) rgba(0, 0, 0, 0.35),
      inset 0 calc(var(--u) * 0.18) 0 rgba(255, 255, 255, 0.22), inset 0 calc(var(--u) * -0.25) 0 rgba(0, 0, 0, 0.35); }
  /* the moulded rim just inside the edge */
  .rim { position: absolute; inset: calc(var(--u) * 1.3); border-radius: calc(var(--u) * 1.6);
    box-shadow: inset 0 0 0 calc(var(--u) * 0.16) rgba(0, 0, 0, 0.3), 0 0 0 calc(var(--u) * 0.16) rgba(255, 255, 255, 0.06); }
  .gloss { position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background:
      linear-gradient(112deg, transparent 8%, rgba(255, 255, 255, 0.13) 17%, rgba(255, 255, 255, 0.03) 27%, transparent 34%),
      linear-gradient(112deg, transparent 62%, rgba(255, 255, 255, 0.06) 70%, transparent 76%); }

  .screw { position: absolute; width: calc(var(--u) * 2.3); height: calc(var(--u) * 2.3); transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f4f4f4, #a6a6a6 45%, #5e5e5e 80%);
    box-shadow: 0 calc(var(--u) * 0.15) calc(var(--u) * 0.3) rgba(0, 0, 0, 0.6), inset 0 0 0 calc(var(--u) * 0.1) rgba(0, 0, 0, 0.25); }
  .screw::before, .screw::after { content: ""; position: absolute; left: 50%; top: 50%; width: 62%; height: 13%; transform: translate(-50%, -50%) rotate(var(--r, 20deg));
    background: rgba(0, 0, 0, 0.55); border-radius: 1px; }
  .screw::after { transform: translate(-50%, -50%) rotate(calc(var(--r, 20deg) + 90deg)); }

  /* ---------- label ---------- */
  .label { position: absolute; left: calc(var(--u) * 5.5); right: calc(var(--u) * 5.5); top: calc(var(--u) * 4); height: calc(var(--u) * 33.5);
    border-radius: calc(var(--u) * 1.1); background: var(--param-label); overflow: hidden;
    color: color-mix(in oklab, var(--param-label), #000 80%);
    box-shadow: inset 0 0 0 calc(var(--u) * 0.12) rgba(0, 0, 0, 0.12), 0 calc(var(--u) * 0.1) calc(var(--u) * 0.25) rgba(0, 0, 0, 0.35); }
  .label .paper { position: absolute; inset: 0; background: url("/runtime/grain.png") 0 0 / calc(var(--u) * 26) repeat; opacity: 0.18; mix-blend-mode: multiply; }
  .label .stripe { position: absolute; left: 0; right: 0; top: calc(var(--u) * 2.2); height: calc(var(--u) * 1.4); background: var(--param-accent); }
  .label .stripe.thin { top: calc(var(--u) * 4.1); height: calc(var(--u) * 0.35); opacity: 0.8; }
  .label .rule { position: absolute; left: calc(var(--u) * 3); right: calc(var(--u) * 3); height: calc(var(--u) * 0.12); background: currentColor; opacity: 0.22; }

  .hand { font-family: var(--hand); color: var(--param-ink); white-space: nowrap; }
  .line1 { position: absolute; left: calc(var(--u) * 3.4); right: calc(var(--u) * 3.4); top: calc(var(--u) * 4.8); height: calc(var(--u) * 6);
    display: flex; align-items: flex-end; gap: calc(var(--u) * 2); }
  .line1 fit-text { flex: 1; min-width: 0; line-height: 1.5; transform: rotate(-0.6deg); transform-origin: left bottom; }
  .line1 .artist { flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; font-size: calc(var(--u) * 2.4); line-height: 1.3; opacity: 0.85;
    transform: rotate(-1.2deg); padding-bottom: calc(var(--u) * 0.3); }
  /* the strip the current line is written on: a lighter piece of tape stuck across the label */
  .strip { position: absolute; left: calc(var(--u) * 1.8); right: calc(var(--u) * 1.8); top: calc(var(--u) * 11.6); height: calc(var(--u) * 5.2);
    background: color-mix(in oklab, var(--param-label), #fff 55%); transform: rotate(0.5deg);
    box-shadow: 0 calc(var(--u) * 0.1) calc(var(--u) * 0.3) rgba(0, 0, 0, 0.12);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 0.6%, #000 99.4%, transparent); }
  .strip .say { position: absolute; left: calc(var(--u) * 2); right: calc(var(--u) * 2); top: 0; bottom: 0; display: flex; align-items: center; }
  .strip fit-text { width: 100%; line-height: 1.45; }
  .sw-live .strip .scrawl.sw-enter { animation: scrawl 1.1s cubic-bezier(0.3, 0.55, 0.3, 1); }
  @keyframes scrawl { from { clip-path: inset(-20% 100% -20% 0); } to { clip-path: inset(-20% 0 -20% 0); } }

  .side { position: absolute; left: calc(var(--u) * 3); top: calc(var(--u) * 19.2); width: calc(var(--u) * 10); text-align: center; }
  .side b { display: block; font: 800 calc(var(--u) * 7.2) / 1 "Avenir Next", Avenir, sans-serif; letter-spacing: -0.04em; }
  .side span { display: block; font: 700 calc(var(--u) * 1.05) / 1 "Avenir Next", Avenir, sans-serif; letter-spacing: 0.32em; margin-top: calc(var(--u) * 0.6); opacity: 0.7; }
  .meter { position: absolute; right: calc(var(--u) * 2.6); top: calc(var(--u) * 20); width: calc(var(--u) * 10.4); text-align: center; }
  .digits { display: inline-flex; gap: calc(var(--u) * 0.25); padding: calc(var(--u) * 0.35); border-radius: calc(var(--u) * 0.5); background: #151515;
    box-shadow: inset 0 calc(var(--u) * 0.2) calc(var(--u) * 0.4) rgba(0, 0, 0, 0.8); }
  .digits i { font: 600 calc(var(--u) * 2.4) / 1 ui-monospace, Menlo, monospace; font-style: normal; color: #eee; width: calc(var(--u) * 2);
    padding: calc(var(--u) * 0.35) 0; border-radius: calc(var(--u) * 0.2);
    background: linear-gradient(#2c2c2c, #3d3d3d 45%, #232323 55%, #171717); }
  .meter span { display: block; font: 700 calc(var(--u) * 1.05) / 1 "Avenir Next", Avenir, sans-serif; letter-spacing: 0.3em; margin-top: calc(var(--u) * 0.9); opacity: 0.7; }
  .print { position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 0.8); text-align: center; white-space: nowrap; overflow: hidden;
    font: 700 calc(var(--u) * 1.05) / 1 "Avenir Next", Avenir, sans-serif; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.55; }

  /* ---------- tape window and reels ---------- */
  .window { position: absolute; left: calc(var(--u) * 22); width: calc(var(--u) * 40); top: calc(var(--u) * 21.2); height: calc(var(--u) * 12.4);
    border-radius: calc(var(--u) * 1.2); overflow: hidden;
    background: radial-gradient(ellipse 60% 120% at 50% 50%, #2a2522, #121110);
    box-shadow: 0 0 0 calc(var(--u) * 0.45) color-mix(in oklab, var(--param-shell), #000 35%), inset 0 calc(var(--u) * 0.3) calc(var(--u) * 0.8) rgba(0, 0, 0, 0.8); }
  .reel { position: absolute; top: 50%; width: calc(var(--u) * 20); height: calc(var(--u) * 20); margin: calc(var(--u) * -10) 0 0 calc(var(--u) * -10); }
  .reel.l { left: calc(var(--u) * 9.6); }
  .reel.r { left: calc(var(--u) * 30.4); }
  .pack { position: absolute; inset: 0; border-radius: 50%;
    background:
      repeating-radial-gradient(circle, rgba(255, 255, 255, 0.035) 0 calc(var(--u) * 0.18), transparent calc(var(--u) * 0.18) calc(var(--u) * 0.45)),
      radial-gradient(circle, #6b4a35 0 18%, #4a3122 40%, #3a2619 70%, #2b1c13);
    box-shadow: inset 0 0 calc(var(--u) * 0.4) rgba(0, 0, 0, 0.6); }
  /* tape runs off the left reel onto the right one: the packs follow the song (data-follow), by area, so it reads true */
  .pack.l { animation: unwind 1s linear both paused; }
  .pack.r { animation: wind 1s linear both paused; }
  @keyframes unwind { 0% { transform: scale(1); } 25% { transform: scale(0.891); } 50% { transform: scale(0.767); } 75% { transform: scale(0.618); } 100% { transform: scale(0.42); } }
  @keyframes wind { 0% { transform: scale(0.42); } 25% { transform: scale(0.618); } 50% { transform: scale(0.767); } 75% { transform: scale(0.891); } 100% { transform: scale(1); } }
  .hub { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * 7.4); height: calc(var(--u) * 7.4); margin: calc(var(--u) * -3.7) 0 0 calc(var(--u) * -3.7); }
  .sw-live .hub { animation: spin var(--spin, 2s) linear infinite; will-change: transform; }
  .sw-live .reel.r .hub { animation-duration: var(--spinR, 2s); }
  .sw-live .reel.l .hub { animation-duration: var(--spinL, 2s); }
  .sw-live:not(.is-playing) .hub { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(-360deg); } }
  .window .glass { position: absolute; inset: 0;
    background:
      linear-gradient(104deg, transparent 22%, rgba(255, 255, 255, 0.16) 28%, rgba(255, 255, 255, 0.03) 40%, transparent 46%),
      linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 30%); }
  .window .ticks { position: absolute; left: 50%; top: calc(var(--u) * 0.9); transform: translateX(-50%); display: flex; gap: calc(var(--u) * 1.1); opacity: 0.45; }
  .window .ticks i { width: calc(var(--u) * 0.14); height: calc(var(--u) * 0.9); background: #fff; }
  .window .ticks i:nth-child(odd) { height: calc(var(--u) * 1.4); }

  /* ---------- the head opening along the bottom ---------- */
  .head { position: absolute; left: calc(var(--u) * 13); right: calc(var(--u) * 13); bottom: 0; height: calc(var(--u) * 12);
    clip-path: polygon(7% 0, 93% 0, 100% 100%, 0 100%);
    background: linear-gradient(180deg, color-mix(in oklab, var(--param-shell), #000 18%), color-mix(in oklab, var(--param-shell), #fff 6%)); }
  .head::before { content: ""; position: absolute; left: 7%; right: 7%; top: 0; height: calc(var(--u) * 0.2); background: rgba(255, 255, 255, 0.12); }
  .hole { position: absolute; background: #0b0b0b; box-shadow: inset 0 calc(var(--u) * 0.3) calc(var(--u) * 0.4) rgba(0, 0, 0, 0.9), 0 calc(var(--u) * 0.12) 0 rgba(255, 255, 255, 0.08); }
  .hole.round { width: calc(var(--u) * 2.8); height: calc(var(--u) * 2.8); border-radius: 50%; top: calc(var(--u) * 5.2); }
  .hole.sq { width: calc(var(--u) * 2.8); height: calc(var(--u) * 2.6); border-radius: calc(var(--u) * 0.4); top: calc(var(--u) * 3.2); }

  .next { position: relative; margin: calc(var(--u) * 4.6) auto 0; width: calc(var(--u) * 72); text-align: center; font-family: var(--hand);
    font-size: calc(var(--u) * 2.5); color: color-mix(in oklab, var(--param-background), #fff 75%); opacity: 0.75;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transform: rotate(calc(var(--param-tilt) * 0.5)); }
  .next:empty { visibility: hidden; }
  .next::before { content: "next: "; opacity: 0.6; }

  /* portrait screens: the case insert stands above the tape */
  @media (max-aspect-ratio: 1/1) {
    :root { --u: min(calc(88vw / 86), calc(100vh / 136)); }
    .scene { flex-direction: column; }
    .jcard { margin: 0 0 calc(var(--u) * 2); transform: rotate(3deg); }
  }
</style>
</head>
<body>
  <div class="room"></div>
  <div class="scene">
    <div class="jcard" data-show="params.jcard">
      <div class="case">
        <div class="art"></div>
        <div class="band">
          <div class="stripe"></div>
          <div class="who" data-bind="track.artist"></div>
          <div class="what" data-bind="track.title"></div>
          <div class="small"><span data-bind="track.album"></span><span data-bind="track.length"></span></div>
        </div>
      </div>
    </div>

    <div class="deck">
      <div class="cassette">
        <div class="rim"></div>
        <div class="label">
          <div class="paper"></div>
          <div class="stripe"></div><div class="stripe thin"></div>
          <div class="line1">
            <fit-text class="hand" max-lines="1" data-bind="track.title"></fit-text>
            <div class="hand artist" data-bind="track.artist"></div>
          </div>
          <div class="rule" style="top: calc(var(--u) * 11)"></div>
          <div class="strip">
            <div class="say" data-lyrics data-show="lyrics.hasLyrics"><fit-text class="hand scrawl" data-animate max-lines="1" data-bind="lyrics.current|note"></fit-text></div>
            <div class="say" data-show="!lyrics.hasLyrics"><fit-text class="hand" max-lines="1" data-bind="track.album"></fit-text></div>
          </div>
          <div class="side"><b>A</b><span>SIDE</span></div>
          <div class="meter" data-show="params.counter"><div class="digits" id="digits"><i>0</i><i>0</i><i>0</i></div><span>COUNT</span></div>
          <div class="print" id="print"></div>
        </div>

        <div class="window">
          <div class="reel l"><div class="pack l" data-follow="song"></div><svg class="hub" viewBox="-50 -50 100 100"><use href="#hub" x="-50" y="-50" width="100" height="100"/></svg></div>
          <div class="reel r"><div class="pack r" data-follow="song"></div><svg class="hub" viewBox="-50 -50 100 100"><use href="#hub" x="-50" y="-50" width="100" height="100"/></svg></div>
          <div class="ticks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="glass"></div>
        </div>

        <div class="head">
          <div class="hole round" style="left: 17%"></div>
          <div class="hole sq" style="left: 33%"></div>
          <div class="hole sq" style="right: 33%"></div>
          <div class="hole round" style="right: 17%"></div>
        </div>

        <div class="screw" style="left: calc(var(--u) * 3.1); top: calc(var(--u) * 3.1); --r: 12deg"></div>
        <div class="screw" style="left: calc(var(--u) * 80.9); top: calc(var(--u) * 3.1); --r: 58deg"></div>
        <div class="screw" style="left: calc(var(--u) * 3.1); top: calc(var(--u) * 50.3); --r: 33deg"></div>
        <div class="screw" style="left: calc(var(--u) * 80.9); top: calc(var(--u) * 50.3); --r: 4deg"></div>
        <div class="screw" style="left: 50%; top: calc(var(--u) * 49); --r: 71deg"></div>
        <div class="gloss"></div>
      </div>
      <div class="next" data-lyrics data-show="params.showNext" data-bind="lyrics.next1"></div>
    </div>
  </div>
  <div class="sw-grain" data-show="params.grain"></div>

  <svg width="0" height="0" style="position: absolute">
    <defs>
      <radialGradient id="hubFill" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#ffffff"/><stop offset="0.7" stop-color="#e2e0dc"/><stop offset="1" stop-color="#b9b6b0"/></radialGradient>
      <symbol id="hub" viewBox="-50 -50 100 100">
        <circle r="49" fill="url(#hubFill)"/>
        <circle r="47" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="2"/>
        <circle r="24" fill="#1a1715"/>
        <g fill="url(#hubFill)">
          <rect x="-4" y="-25" width="8" height="10" rx="1.5"/><rect x="-4" y="-25" width="8" height="10" rx="1.5" transform="rotate(60)"/>
          <rect x="-4" y="-25" width="8" height="10" rx="1.5" transform="rotate(120)"/><rect x="-4" y="-25" width="8" height="10" rx="1.5" transform="rotate(180)"/>
          <rect x="-4" y="-25" width="8" height="10" rx="1.5" transform="rotate(240)"/><rect x="-4" y="-25" width="8" height="10" rx="1.5" transform="rotate(300)"/>
        </g>
        <g fill="rgba(0,0,0,.22)"><circle cx="0" cy="-36" r="5"/><circle cx="31" cy="18" r="5"/><circle cx="-31" cy="18" r="5"/></g>
      </symbol>
    </defs>
  </svg>

  <script>
    const digits = [...document.querySelectorAll("#digits i")], print = document.getElementById("print");
    // the tape counter counts seconds of tape, like the mechanical one
    const count = (ctx) => {
      const s = String(Math.floor(ctx.track.position || 0) % 1000).padStart(3, "0");
      digits.forEach((d, k) => { if (d.textContent !== s[k]) d.textContent = s[k]; });
    };
    // fit-text sizes in this page's unit (1u = 1/84 of the cassette's width)
    const sizes = { ".line1 fit-text": [2.2, 4.6], ".strip fit-text": [1.7, 3.5] };
    let spunFor = null;
    Wallpaper.on("render", (ctx) => {
      count(ctx);
      const u = document.querySelector(".cassette").offsetWidth / 84;
      for (const sel in sizes) document.querySelectorAll(sel).forEach((el) => {
        el.setAttribute("min", (sizes[sel][0] * u).toFixed(1) + "px");
        el.setAttribute("max", (sizes[sel][1] * u).toFixed(1) + "px");
      });
      const bits = ["C-90", "Type I · Normal", ctx.track.genre, ctx.track.length].filter(Boolean);
      const text = bits.join("   ·   ");
      if (print.textContent !== text) print.textContent = text;
      // Tape moves past the head at a constant speed, so the reel with less tape on it turns faster. Set per song (not per
      // line) so the hubs never jump.
      if (spunFor !== ctx.track.id) {
        spunFor = ctx.track.id;
        const p = ctx.track.progress || 0, r = (q) => Math.sqrt(0.1764 + q * 0.8236);
        const root = document.documentElement.style;
        root.setProperty("--spinL", (2.6 * r(1 - p)).toFixed(2) + "s");
        root.setProperty("--spinR", (2.6 * r(p)).toFixed(2) + "s");
      }
    });
    Wallpaper.on("tick", count);
  </script>
</body>
</html>
